[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpflow"
version = "0.1.0"
description = "MCP Flow: one-process MCP gateway with an admin web UI for the homelab."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmet Bilgili", email = "ahmetbilgili@gmail.com" }]
dependencies = [
    "fastmcp>=4.1.0,<5",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
mcpflow = "mcpflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpflow"]
