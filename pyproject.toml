[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpflow"
version = "0.1.0"
description = "MCP Flow: one-process MCP gateway with an admin web UI for the homelab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.2,<5",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
mcpflow = "mcpflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpflow"]
